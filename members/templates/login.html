{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — LifeGive</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --red: #C0392B; --red-dark: #922B21; --red-light: #FADBD8;
            --bg: #FAFAF8; --surface: #FFFFFF; --text: #1A1A1A;
            --muted: #6B6B6B; --border: #E8E2DA;
        }
        body {
            font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }

        .login-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
            padding: 40px; width: 100%; max-width: 380px;
        }

        .logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 28px; text-decoration: none; }
        .logo-icon {
            width: 40px; height: 40px; background: var(--red); border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
        }
        .logo-icon svg { width: 22px; height: 22px; fill: white; }
        .logo-text { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--text); }
        .logo-text span { color: var(--red); }

        h2 {
            font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700;
            text-align: center; margin-bottom: 6px;
        }
        .subtitle { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 28px; }

        .form-group { margin-bottom: 16px; }
        label {
            display: block; font-size: 12px; font-weight: 600; color: var(--muted);
            letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 7px;
        }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 11px 14px; font-family: 'DM Sans', sans-serif; font-size: 14px;
            color: var(--text); background: var(--bg); border: 1px solid var(--border);
            border-radius: 10px; outline: none; transition: border 0.2s, box-shadow 0.2s;
        }
        input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(192,57,43,0.1); background: white; }

        .submit-btn {
            width: 100%; padding: 13px; background: var(--red); color: white; border: none;
            border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
            margin-top: 8px; transition: background 0.2s;
        }
        .submit-btn:hover { background: var(--red-dark); }

        .msg {
            padding: 11px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px;
            background: var(--red-light); color: var(--red);
        }

        .signup-hint {
            text-align: center; font-size: 13px; color: var(--muted); margin-top: 20px;
        }
        .signup-hint a { color: var(--red); text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>

<div class="login-card">
    <a href="{% url 'home' %}" class="logo">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C6 8 4 12 4 15a8 8 0 0016 0c0-3-2-7-8-13z"/></svg>
        </div>
        <span class="logo-text">Life<span>Give</span></span>
    </a>

    <h2>Donor Login</h2>
    <p class="subtitle">Access your profile to update your details</p>

    {% if messages %}
        {% for message in messages %}
        <div class="msg">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Your username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Your password" required>
        </div>
        <button type="submit" class="submit-btn">Log In</button>
    </form>

    <p class="signup-hint">New donor? <a href="{% url 'home' %}">Register here</a></p>
</div>

</body>
</html>
